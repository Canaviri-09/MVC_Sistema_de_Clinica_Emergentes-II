{% extends "base.html" %}
{% block title %}Editar Paciente{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="my-4">Actualizar Paciente</h1>
    <form action="{{ url_for('paciente.edit', id=paciente.id) }}" method="POST">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ paciente.nombre }}" required>
      </div>
      <div class="mb-3">
        <label for="edad" class="form-label">Edad</label>
        <input type="number" min="0" max="150" class="form-control" id="edad" name="edad" value="{{ paciente.edad }}" required>
      </div>
      <div class="mb-3">
        <label for="direccion" class="form-label">Direccion</label>
        <input type="text" class="form-control" id="direccion" name="direccion" value="{{ paciente.direccion }}" required>
      </div>
      <div class="mb-3">
        <label for="telefono" class="form-label">Telefono</label>
        <input type="text" class="form-control" id="telefono" name="telefono" value="{{ paciente.telefono }}" required>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('paciente.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
