{% extends "base.html" %}

{% block title %}Panel Principal{% endblock %}

{% block content %}
<h1 class="my-4">Panel Administrativo</h1>
<p class="text-muted">Bienvenido al Sistema de Gestion de Clinica Medica</p>

<div class="d-flex flex-wrap gap-2 mb-3">
    <a href="{{ url_for('medico.create') }}" class="btn btn-outline-primary">Nuevo Medico</a>
    <a href="{{ url_for('paciente.create') }}" class="btn btn-outline-primary">Nuevo Paciente</a>
    <a href="{{ url_for('consulta.create') }}" class="btn btn-success">Registrar Consulta</a>
    <a href="{{ url_for('usuario.index') }}" class="btn btn-outline-secondary">Gestionar Usuarios</a>
</div>

<div class="d-flex flex-wrap gap-2">
    <a href="{{ url_for('medico.index') }}" class="btn btn-primary">Ver Medicos</a>
    <a href="{{ url_for('paciente.index') }}" class="btn btn-primary">Ver Pacientes</a>
    <a href="{{ url_for('consulta.index') }}" class="btn btn-primary">Ver Consultas</a>
</div>
{% endblock %}
