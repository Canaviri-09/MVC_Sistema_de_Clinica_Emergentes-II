{% extends "base.html" %}
{% block title %}Editar Usuario{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="my-4">Actualizar Usuario</h1>
    <form action="{{ url_for('usuario.edit', id=usuario.id) }}" method="POST">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de Usuario (Login)</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ usuario.username }}" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contrasena</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Dejar en blanco para mantener la actual">
      </div>
      <div class="mb-3">
        <label for="rol" class="form-label">Rol del Usuario</label>
        <select id="rol" name="rol" class="form-select" required>
          <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
          <option value="medico" {% if usuario.rol == 'medico' %}selected{% endif %}>Medico</option>
          <option value="recepcionista" {% if usuario.rol == 'recepcionista' %}selected{% endif %}>Recepcionista</option>
        </select>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('usuario.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
