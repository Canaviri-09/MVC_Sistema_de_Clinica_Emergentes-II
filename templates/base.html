<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clínica Médica{% endblock %} | Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; } /* Fondo blanco */
        .navbar { background-color: #0077a8 !important; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .nav-link:hover { color: #cceeff !important; }
        .nav-link.active { background-color: #0096c7; border-radius: 5px; font-weight: bold; }
        .table thead { background-color: #0077a8; color: #fff; }
        .table-striped > tbody > tr:nth-of-type(odd) { background-color: #e8f6fb; }
        .btn-primary { background-color: #0096c7; border-color: #0096c7; }
        .btn-primary:hover { background-color: #0077a8; border-color: #0077a8; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Clinica Medica</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link {{ is_active('/medicos') }}" href="/medicos/">Medicos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ is_active('/pacientes') }}" href="/pacientes/">Pacientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ is_active('/consultas') }}" href="/consultas/">Consultas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ is_active('/usuarios') }}" href="/usuarios/">Usuarios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
